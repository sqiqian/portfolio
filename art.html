<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noai, noimageai">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sketchbook </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crafty+Girls&family=Lora:ital,wght@0,400;0,600;1,400&family=VT323&display=swap" rel="stylesheet">

    <script>
        (function () {
            try {
                var m = document.cookie.match(/(?:^|; )portfolio-theme=([^;]*)/);
                var t = m ? decodeURIComponent(m[1]) : null;
                if (!t) {
                    try { t = localStorage.getItem("portfolio-theme"); } catch (e) {}
                }
                if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                    document.documentElement.setAttribute("data-theme", "dark");
                }
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="theme.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-size: 1.15rem;
            line-height: 1.8;
            padding: 0 6% 5%;
        }

        body > * { position: relative; z-index: 1; }

        .gallery-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .gallery-header {
            text-align: left;
            margin-top: 48px;
            margin-bottom: 48px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--border-dream);
            position: relative;
        }

        .gallery-header .pixel-label {
            margin-bottom: 8px;
            opacity: 0.6;
        }

        .gallery-header h1 {
            font-family: "Cinzel", serif;
            font-size: clamp(2.4rem, 5vw, 3.6rem);
            margin-bottom: 8px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .gallery-header p {
            color: var(--dream-muted-text);
            font-size: 1rem;
            font-family: "VT323", monospace;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 36px 28px;
        }

        .art-frame {
            background: rgba(238, 232, 218, 0.55);
            border: 1px solid var(--border-dream);
            padding: 12px 12px 20px;
            border-radius: 2px;
            box-shadow: var(--shadow-soft);
            text-align: left;
            transition: box-shadow var(--transition-mid) ease, filter var(--transition-mid) ease;
            position: relative;
            overflow: hidden;
        }

        .art-frame:nth-child(2) {
            margin-top: 24px;
            background: rgba(189, 214, 225, 0.28);
        }

        .art-frame:nth-child(3) {
            margin-top: 8px;
            background: rgba(175, 205, 190, 0.22);
        }

        .art-frame::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            background: linear-gradient(135deg, rgba(238, 232, 218, 0.2), transparent 45%);
            mix-blend-mode: soft-light;
            transition: opacity var(--transition-mid) ease;
        }

        .art-frame:hover {
            box-shadow:
                2px 0 0 rgba(213, 163, 173, 0.3),
                -2px 0 0 rgba(134, 184, 211, 0.3),
                var(--shadow-lift);
            transform: none;
        }

        .art-frame:hover::before { opacity: 0.2; }

        .art-frame:hover .art-image {
            filter: saturate(1) contrast(1) brightness(1);
        }

        .art-image {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid var(--border-soft);
            border-radius: 1px;
            margin-bottom: 14px;
            filter: saturate(var(--img-saturation)) contrast(var(--img-contrast));
            transition: filter var(--transition-mid) ease;
        }

        .art-meta {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-family: "VT323", monospace;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            color: var(--dream-muted-text);
            margin-bottom: 6px;
        }

        .art-caption {
            font-family: "Cinzel", serif;
            color: var(--dream-ink);
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }

        .art-medium {
            font-family: "Lora", serif;
            font-style: italic;
            color: var(--dream-muted-text);
            font-size: 0.95rem;
        }

        footer {
            margin-top: 100px;
            padding: 40px 0;
            text-align: center;
        }

        .footer-copy {
            font-size: 0.9rem;
            opacity: 0.7;
            font-family: "VT323", monospace;
            letter-spacing: 0.12em;
        }

        @media (max-width: 768px) {
            .gallery-grid { grid-template-columns: 1fr; }
            .art-frame:nth-child(n) { margin-top: 0; }
            body { padding: 0 5% 5%; }
        }
    </style>
</head>
<body class="dream-body">

    <nav class="main-menu" aria-label="Primary">
        <a href="index.html" class="nav-btn btn-home">Home</a>
        <a href="cv.html" class="nav-btn btn-about">About</a>
        <a href="#" class="nav-btn btn-projects">Projects</a>
        <a href="#" class="nav-btn btn-blog">Blog</a>
        <button type="button" class="theme-toggle" aria-label="Switch to dark mode" title="Dark mode">☾</button>
    </nav>

    <div class="gallery-container">

        <header class="gallery-header">
            <p class="pixel-label">ARCHIVE · SKETCHBOOK</p>
            <h1>The Sketchbook</h1>
            <p>Visual Lore & Illustrations</p>
        </header>

        <div class="gallery-grid">

            <div class="art-frame">
                <img src="image_1.jpg" alt="Artwork Description" class="art-image">
                <div class="art-meta"><span>SCAN_01</span><span>2019</span></div>
                <div class="art-caption">Fusion</div>
                <div class="art-medium">2019 - Oil on Canva</div>
            </div>

            <div class="art-frame">
                <img src="image_2.jpg" alt="Artwork Description" class="art-image">
                <div class="art-meta"><span>SCAN_02</span><span>2019</span></div>
                <div class="art-caption">Bitter Sweet</div>
                <div class="art-medium"> 2019 - Colour Pencils </div>
            </div>

            <div class="art-frame">
                <img src="image_3.jpg" alt="Artwork Description" class="art-image">
                <div class="art-meta"><span>SCAN_03</span><span>2020</span></div>
                <div class="art-caption">Death and Reborn</div>
                <div class="art-medium">2020 - Archylic on Paper</div>
            </div>

        </div>

    </div>

    <footer>
        <p class="footer-copy">
            © <span id="currentYear"></span>. All Rights Reserved.
        </p>
    </footer>

    <script>
        document.getElementById("currentYear").textContent = new Date().getFullYear();
    </script>
    <script src="theme.js" defer></script>
</body>
</html>
